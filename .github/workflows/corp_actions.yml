name: Fetch NSE corporate actions

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/corp_actions.yml"
      - "fetch_corp_actions.py"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - run: python fetch_corp_actions.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/corp_actions.csv
          git diff --cached --quiet && exit 0
          git commit -m "NSE corporate actions $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
